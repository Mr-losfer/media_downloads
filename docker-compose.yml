# Media Super · 单容器部署（直接拉取 GitHub Container Registry 镜像）
#
#   docker compose up -d
#   docker compose logs -f
#
# 需要改保存目录时，把宿主机路径填到 DOWNLOAD_DIR：
#   DOWNLOAD_DIR=/vol1/1000/影视 docker compose up -d
services:
  mediasuper:
    image: ghcr.io/mr-losfer/media-super:latest
    container_name: mediasuper
    restart: unless-stopped

    ports:
      - "9099:8080"

    environment:
      TZ: Asia/Shanghai
      # 首次启动使用的管理员密码（默认 losfer），登录后请到「设置 → 管理员密码」修改
      MS_ADMIN_PASS: "${MS_ADMIN_PASS:-losfer}"
      # 保存目录：容器内路径:显示名，多个用逗号分隔
      MS_SAVE_DIRS: "${MS_SAVE_DIRS:-/downloads:下载}"
      MS_DEFAULT_DIR: "${MS_DEFAULT_DIR:-/downloads}"
      # 低配默认：2 个任务 × 8 连接 = 最多 16 个并发连接
      MS_MAX_TASKS: "2"
      MS_SEG_CONNS: "8"
      MS_SPEED_LIMIT_KB: "0"
      MS_FFMPEG: /usr/bin/ffmpeg
      MS_WEBHOOK_URL: ""

    volumes:
      # 数据库 / 临时分片 / 一键更新下载的新版本都在这里，别删
      - ./data:/data
      # 宿主机下载目录 → 容器内 /downloads
      - "${DOWNLOAD_DIR:-./downloads}:/downloads"

    # ---- 低配保护：这四项是关键 ----
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256

    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
